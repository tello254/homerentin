# Netlify configuration for HomeRentin
[build]
  command = "npm run build"
  publish = "dist"

# Serve each prerendered room page directly at the no-slash URL,
# so canonical tags don't conflict with a trailing-slash redirect
[[redirects]]
  from = "/room/:code"
  to = "/room/:code/index.html"
  status = 200

# Same for the prerendered keyword landing pages
[[redirects]]
  from = "/houses-for-rent-in-kisii"
  to = "/houses-for-rent-in-kisii/index.html"
  status = 200
[[redirects]]
  from = "/bedsitters-for-rent-in-kisii"
  to = "/bedsitters-for-rent-in-kisii/index.html"
  status = 200
[[redirects]]
  from = "/single-rooms-for-rent-in-kisii"
  to = "/single-rooms-for-rent-in-kisii/index.html"
  status = 200
[[redirects]]
  from = "/apartments-for-rent-in-kisii"
  to = "/apartments-for-rent-in-kisii/index.html"
  status = 200
[[redirects]]
  from = "/one-bedroom-houses-in-kisii"
  to = "/one-bedroom-houses-in-kisii/index.html"
  status = 200
[[redirects]]
  from = "/two-bedroom-houses-in-kisii"
  to = "/two-bedroom-houses-in-kisii/index.html"
  status = 200

# SPA fallback: every unknown path serves the app shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change — cache them forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must revalidate so new deploys show up immediately
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SEO files should always be fresh
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sensible security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
